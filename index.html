const KEY="ielts7_checkins_v2";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
const now=new Date(); const iso=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
function key(d,i){return d.date+"_"+i}
function pctDay(d){return Math.round(d.tasks.filter((_,i)=>state[key(d,i)]).length/d.tasks.length*100)}
function save(){localStorage.setItem(KEY,JSON.stringify(state));update()}
function update(){
 let total=DAYS.reduce((a,d)=>a+d.tasks.length,0),done=DAYS.reduce((a,d)=>a+d.tasks.filter((_,i)=>state[key(d,i)]).length,0),dd=DAYS.filter(d=>pctDay(d)==100).length,p=Math.round(done/total*100);
 document.getElementById("done").textContent=done;document.getElementById("total").textContent=total;document.getElementById("daysDone").textContent=dd;document.getElementById("pct").textContent=p+"%";document.getElementById("bar").style.width=p+"%";
}
function render(list){
 document.getElementById("content").innerHTML=list.map(d=>`
 <section class="day ${d.date==iso?'today':''}">
  <div class="head"><div><div class="date">${d.label} ${d.weekday}</div><div class="phase">${d.phase}</div></div><div class="pct">${pctDay(d)}%</div></div>
  <div class="target"><b>阶段目标：</b>${d.target}</div>
  ${d.tasks.map((t,i)=>`<label class="task"><input class="check" type="checkbox" ${state[key(d,i)]?'checked':''} onchange="toggle('${d.date}',${i},this.checked)"><div><div class="tasktitle">${t[0]}</div><div class="desc">${t[1]}</div></div></label>`).join("")}
  <div class="note"><textarea placeholder="今日记录（可选）：分数、错题、状态……" oninput="note('${d.date}',this.value)">${state["note_"+d.date]||""}</textarea></div>
 </section>`).join("");
 update();
}
function toggle(d,i,v){state[key({date:d},i)]=v;save();render(document.getElementById("allBtn").classList.contains("active")?DAYS:[DAYS.find(x=>x.date==iso)||DAYS[0]])}
function note(d,v){state["note_"+d]=v;localStorage.setItem(KEY,JSON.stringify(state))}
function today(){document.getElementById("todayBtn").classList.add("active");document.getElementById("allBtn").classList.remove("active");render([DAYS.find(x=>x.date==iso)||DAYS[0]])}
function allDays(){document.getElementById("allBtn").classList.add("active");document.getElementById("todayBtn").classList.remove("active");render(DAYS)}
today();
</script>
